name: Claude Agent

# Manual-only. The runner joins the tailnet as an ephemeral tagged node, reaches
# Claude through the Aperture AI gateway (no Anthropic credential in this repo),
# edits the checkout, then commits and pushes whatever changed.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should the agent do? It can read, write, and edit any file in the repo."
        required: true
        type: string
      model:
        description: "Model ID. Must be in Aperture's provider `models` list and match your grant's glob."
        required: false
        default: anthropic/claude-haiku-4.5
        type: string
      max_turns:
        description: "Hard cap on agentic turns"
        required: false
        default: "25"
        type: string
      commit:
        description: "Commit and push the agent's changes (uncheck for a dry run)"
        required: false
        default: true
        type: boolean

# Needed to push the agent's work back to the branch.
# No `id-token: write`: that's only for Tailscale's federated OIDC auth, not an OAuth client.
permissions:
  contents: write

# Two agents editing the same branch would race on the push.
concurrency:
  group: claude-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  # Aperture's hostname on your tailnet. Set `APERTURE_HOST` as a repo variable
  # (Settings -> Secrets and variables -> Actions -> Variables) or as a secret.
  APERTURE_HOST: ${{ vars.APERTURE_HOST || secrets.APERTURE_HOST || 'ai' }}
  # Device name and ACL tag for the ephemeral node. The tag must already exist in
  # your tailnet's `tagOwners`, and the OAuth client must carry the same tag.
  TS_HOSTNAME: ${{ vars.TS_HOSTNAME || 'ai-workflow' }}
  TS_TAG: ${{ vars.TS_TAG || 'tag:ai-workflow-machine' }}

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the agent can read `git log` and `git diff`.
          fetch-depth: 0
          # checkout writes this credential into .git/config, and every later git
          # command -- including the push below -- inherits it. Handing a token to
          # the push step alone would do nothing. Set the WORKFLOW_PAT secret (a
          # PAT with the `workflow` scope) if the agent needs to edit files under
          # .github/workflows/; the default GITHUB_TOKEN can never push those.
          token: ${{ secrets.WORKFLOW_PAT || github.token }}

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ env.TS_TAG }}
          hostname: ${{ env.TS_HOSTNAME }}
          # Fails the job if Aperture isn't reachable, before we install anything.
          ping: ${{ env.APERTURE_HOST }}

      - name: Show what Aperture offers this node
        continue-on-error: true
        env:
          AGENT_MODEL: ${{ inputs.model }}
        run: |
          set -uo pipefail
          echo "Gateway: http://$APERTURE_HOST  (identity: $TS_TAG)"
          if ! models=$(curl -fsS --max-time 15 "http://$APERTURE_HOST/v1/models"); then
            echo "::warning::Could not list models from http://$APERTURE_HOST/v1/models."
            echo "Reachability was already confirmed by tailscale ping, so this is most"
            echo "likely a missing grant: 403 means no { \"role\": \"user\" } for $TS_TAG."
            exit 0
          fi
          MODELS_JSON="$models" python3 - <<'PY'
          import json, os
          want = os.environ["AGENT_MODEL"]
          try:
              data = json.loads(os.environ["MODELS_JSON"])
          except json.JSONDecodeError:
              print("::warning::/v1/models did not return JSON; skipping the model check.")
              raise SystemExit(0)
          entries = data.get("data", data if isinstance(data, list) else [])
          ids = sorted({m["id"] for m in entries if isinstance(m, dict) and m.get("id")})
          print(f"Models available to this identity ({len(ids)}):")
          for model_id in ids:
              print(f"  - {model_id}")
          # Aperture may report bare names or provider/model; accept either.
          if ids and want not in ids and want not in {i.rsplit("/", 1)[-1] for i in ids}:
              print(f"::warning::Requested model '{want}' is not in that list. Expect an "
                    "HTTP 404 from Aperture unless it resolves as an alias.")
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the Agent SDK
        run: pip install -r requirements.txt

      - name: Run the agent
        id: agent
        env:
          # The only thing pointing Claude at Aperture. Aperture does a WhoIs on the
          # source tailnet IP, matches the grant for TS_TAG, and injects the real
          # Anthropic key upstream -- so there is no API key or OAuth token here.
          # Must be http://, not https:// (Aperture serves plain HTTP on the tailnet).
          ANTHROPIC_BASE_URL: http://${{ env.APERTURE_HOST }}
          # Inputs go through env, never into the `run:` string: a prompt containing
          # `$(...)` or backticks would otherwise execute on the runner.
          AGENT_PROMPT: ${{ inputs.prompt }}
          AGENT_MODEL: ${{ inputs.model }}
          AGENT_MAX_TURNS: ${{ inputs.max_turns }}
          AGENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/run_agent.py \
            --prompt-env AGENT_PROMPT \
            --model "$AGENT_MODEL" \
            --max-turns "$AGENT_MAX_TURNS"

      - name: Commit and push
        # Runs even when the agent errored, so the failure report still lands in the repo.
        if: ${{ !cancelled() && inputs.commit }}
        env:
          AGENT_PROMPT: ${{ inputs.prompt }}
          AGENT_STATUS: ${{ steps.agent.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Agent produced no changes; nothing to commit."
            echo "_Agent produced no changes; nothing to commit._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # First line of the prompt, trimmed, as the commit subject. Quoted
          # expansions only, so prompt text is never re-evaluated by the shell.
          subject="${AGENT_PROMPT%%$'\n'*}"
          git commit \
            -m "agent: ${subject:0:68}" \
            -m "$AGENT_PROMPT" \
            -m "Agent status: $AGENT_STATUS" \
            -m "Run: $RUN_URL"

          # Retry only the one failure a retry can fix: someone pushed while the
          # agent was thinking. Anything else is rejected for a standing reason,
          # so rebasing three times just hides the real message.
          err=$(mktemp)
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME" 2>&1 | tee "$err"; then
              exit 0
            fi

            if grep -qiE 'fetch first|non-fast-forward|behind its remote|stale info' "$err"; then
              echo "Remote moved on (attempt $attempt); rebasing onto origin/$GITHUB_REF_NAME..."
              git pull --rebase origin "$GITHUB_REF_NAME"
              continue
            fi

            echo "::error::Push rejected for a reason a rebase will not fix. See above."
            if git show --name-only --format= HEAD | grep -q '^\.github/workflows/'; then
              echo "::error::This commit changes .github/workflows/. The default GITHUB_TOKEN can"
              echo "never push workflow files: there is no 'workflows' key in the permissions"
              echo "block, so no setting grants it. GitHub rejects the push server-side, sometimes"
              echo "as a bare 500. Either add a PAT with the 'workflow' scope as the WORKFLOW_PAT"
              echo "secret (it is wired into actions/checkout above), or keep workflow edits out"
              echo "of agent runs and apply them yourself."
            fi
            exit 1
          done

          echo "::error::Still behind the remote after 3 rebases; giving up."
          exit 1
